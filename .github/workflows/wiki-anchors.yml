name: wiki-anchors

# The wiki CI blocks a heading rename that breaks a citation (check-anchors.py --site); the weekly run
# is the backstop for the live site, the push run catches a bad citation added here.
on:
  push:
    branches: [main]
    paths: ['plugins/wiki/**']
  pull_request:
    paths: ['plugins/wiki/**']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check wiki anchors
        run: python3 plugins/wiki/check-anchors.py
